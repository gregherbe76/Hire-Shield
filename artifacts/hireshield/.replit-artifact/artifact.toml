kind = "web"
previewPath = "/"
title = "HireShield"
version = "1.0.0"
id = "artifacts/hireshield"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22261

[services.development]
run = "pnpm --filter @workspace/hireshield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hireshield", "run", "build" ]
publicDir = "artifacts/hireshield/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22261"
BASE_PATH = "/"
