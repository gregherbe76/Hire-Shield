name: Bug report
description: Something isn't working as expected
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I pasted a URL into /analyze, …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /analyze
        2. Paste …
        3. Click Analyze
        4. See …
    validations:
      required: true
  - type: input
    id: posting
    attributes:
      label: Example posting (redacted)
      description: A minimal job posting or URL that reproduces the bug. Redact any personal info.
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v24.0.0"
  - type: dropdown
    id: where
    attributes:
      label: Where did you see this?
      options:
        - Live demo (hire-shield.replit.app)
        - Local fork
        - Self-hosted deployment
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any console output, server logs, or screenshots.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../CODE_OF_CONDUCT.md).
          required: true
